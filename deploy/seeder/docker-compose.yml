# Seed one site, permanently, including every version of it — this does NOT
# host the gate.
#
# If you are looking for "run Spore so people can browse", that is
# deploy/gate/. This keeps a single published site reachable when nobody has a
# tab open.
#
#   cd deploy/seeder
#   cp .env.example .env && $EDITOR .env     # name, site, passphrase
#   mkdir -p site data && cp -r /path/to/your-website/. site/
#   docker compose up -d
#   curl -s localhost:8081                   # is it actually serving?
#
# Edit anything in site/ and a new version is published within
# SPORE_WATCH_SECONDS, signed, and offered to readers still on the old one. The
# old versions keep being seeded — that is not politeness, it is the mechanism:
# only a peer holding the version someone is reading can tell them there is a
# newer one.

services:
  seeder:
    # Built from the repository root: the seeder shares the gate's own signing
    # code, so it needs js/ as well as tools/.
    build:
      context: ../..
      dockerfile: deploy/seeder/Dockerfile
    restart: unless-stopped

    # Everything is configured here, so there are no arguments to get wrong and
    # the passphrase never appears in a command line — where `docker inspect`,
    # `ps` and shell history would all have it.
    env_file: .env

    volumes:
      # The folder you edit. Read-only is fine and correct: the seeder copies
      # each version into data/ and seeds the copy, so it never writes here.
      - ./site:/site:ro
      # Every published version, frozen, plus versions.json. KEEP THIS. It is
      # what makes each magnet permanent and what lets old readers be told
      # about new versions.
      - ./data:/data

    # Nothing to publish inbound for the swarm itself: WebRTC connections are
    # established outbound through the trackers, so seeding needs no
    # forwarding. The one port is the status endpoint, on localhost — enough
    # for curl on the box and for the healthcheck, without putting it on the
    # internet. Change to "8081:8081" to reach it from your laptop.
    ports:
      - "127.0.0.1:8081:8081"
    network_mode: bridge
