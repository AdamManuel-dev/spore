# Seed one site, permanently — this does NOT host the gate.
#
# If you are looking for "run Spore so people can browse", that is
# deploy/gate/. This one keeps a single published site reachable when nobody
# has a tab open.
#
#   cd deploy/seeder
#   mkdir -p site data && cp -r /path/to/your-website/. site/
#   docker compose up -d
#
# The magnet is printed once at startup. It is pinned in data/site.torrent, so
# it stays the same across restarts and rebuilds — keep that file and the link
# you shared never breaks.
#
# Editing the site changes its content, and content is the address here: you
# will get a new magnet and the old link keeps serving the old bytes until
# nobody holds them. Mutable addresses are a later phase of the project.

services:
  seeder:
    # Built from the repository root: the seeder needs js/config.js and
    # tools/seed.mjs, which live there.
    build:
      context: ../..
      dockerfile: deploy/seeder/Dockerfile
    restart: unless-stopped
    # The torrent's name comes from the folder, which here is the mount point —
    # so without this every published site is called "site". It is part of the
    # infohash, so pick it once: changing it changes the address.
    command: ["/site", "--torrent", "/data/site.torrent", "--name", "my-site", "--status", "8081"]
    volumes:
      # Not :ro, and it is worth knowing why. Seeding a pinned torrent goes
      # through WebTorrent's add(), which opens the files read-write to verify
      # them against the torrent. Mounted read-only it connects to peers and
      # then serves nothing at all: verification silently fails, so it has no
      # verified pieces to offer. Observed as "1 peer, progress 0.00, forever".
      - ./site:/site
      - ./data:/data
    # Nothing to publish inbound for the swarm itself: WebRTC connections are
    # established outbound through the trackers, so seeding needs no forwarding.
    # The one port here is the status endpoint, bound to localhost — enough for
    # `curl` on the box and for the healthcheck, without putting it on the
    # internet. Change to "8081:8081" to reach it from your laptop.
    ports:
      - "127.0.0.1:8081:8081"
    network_mode: bridge
